name: Backup database

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC diario
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges | gzip > backup.sql.gz

      - name: Push backup to private ops repo
        env:
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d_%H%M)
          git clone --depth 1 "https://x-access-token:${OPS_REPO_TOKEN}@github.com/Yisbel-Finanzas/Control-finanzas-ops.git" ops
          mkdir -p ops/backups/control-finanzas-app
          cp backup.sql.gz "ops/backups/control-finanzas-app/backup_${DATE}.sql.gz"
          cd ops
          git config user.name "backup-bot"
          git config user.email "actions@github.com"
          git add "backups/control-finanzas-app/backup_${DATE}.sql.gz"

          # Conservar solo los últimos 30 backups
          ls -1 backups/control-finanzas-app/*.sql.gz | sort | head -n -30 | xargs -r git rm --quiet

          git commit -m "Backup control-finanzas-app DB - ${DATE}"
          git push origin HEAD:main
